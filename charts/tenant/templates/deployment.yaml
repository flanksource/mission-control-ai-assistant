apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mission-control-ai-assistant-tenant.fullname" . }}
  labels:
    {{- include "mission-control-ai-assistant-tenant.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mission-control-ai-assistant-tenant.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mission-control-ai-assistant-tenant.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: tenant-bot
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PROXY_WS_URL
              value: {{ .Values.config.proxyWsUrl | quote }}
            {{- $secrets := .Values.secrets.name -}}
            {{- if $secrets }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secrets }}
                  key: {{ .Values.secrets.slackBotTokenKey }}
            - name: PROXY_JWT
              valueFrom:
                secretKeyRef:
                  name: {{ $secrets }}
                  key: {{ .Values.secrets.proxyJwtKey }}
            {{- end }}
            {{- $llmSecret := default $secrets .Values.llm.secretName -}}
            {{- if and $llmSecret (eq .Values.llm.provider "anthropic") }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $llmSecret }}
                  key: {{ .Values.llm.secretKey }}
            {{- end }}
            {{- if and $llmSecret (eq .Values.llm.provider "openai") }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $llmSecret }}
                  key: {{ .Values.llm.secretKey }}
            {{- end }}
            {{- if and $llmSecret (eq .Values.llm.provider "google") }}
            - name: GOOGLE_GENERATIVE_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $llmSecret }}
                  key: {{ .Values.llm.secretKey }}
            {{- end }}
            {{- if .Values.llm.model }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            {{- end }}
            {{- if .Values.mcp.enabled }}
            {{- $mcpSecret := default $secrets .Values.mcp.secretName -}}
            {{- if $mcpSecret }}
            - name: MCP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $mcpSecret }}
                  key: {{ .Values.mcp.urlKey }}
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $mcpSecret }}
                  key: {{ .Values.mcp.bearerTokenKey }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
