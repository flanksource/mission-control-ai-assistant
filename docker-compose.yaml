services:
  slack-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    network_mode: host
    environment:
      - SLACK_APP_TOKEN
      - SQLITE_DB_PATH
      - PROXY_JWT_SECRET
      - PROXY_WS_PORT
      - PROXY_HTTP_PORT
    volumes:
      - ./database.db:/data/database.db
    restart: unless-stopped

  tenant-bot:
    build:
      context: .
      dockerfile: Dockerfile.tenant
    network_mode: host
    environment:
      - SLACK_BOT_TOKEN
      - PROXY_WS_URL
      - PROXY_JWT
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GOOGLE_GENERATIVE_AI_API_KEY
      - LLM_MODEL
      - LOG_LEVEL
      - MCP_URL
      - MCP_BEARER_TOKEN
    restart: unless-stopped

volumes:
  slack-proxy-data: {}
